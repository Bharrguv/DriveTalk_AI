name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:  # allows manual run from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DriveTalk health endpoint
        run: |
          echo "Pinging backend..."
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://drivetalk-ai.onrender.com/health)
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Backend not healthy"
            exit 1
          fi
          echo "Backend is awake"